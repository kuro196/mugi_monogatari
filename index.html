<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff8a1f">
<!-- スマホのホーム画面に置いたときのアイコンと、ホーム画面から開いたときの設定（manifest.json） -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ムギ物語">
<title>ムギクエスト ～ムギ物語～</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2442;--sub:#6e6880;--orange:#ff8a1f;--orange-d:#de6a00;--cream:#fff3d4;--rim:#ffe2a0;--green:#1f9d55;--green-d:#157a41;--green-bg:#e2f7e8;--red:#e5484d;--red-bg:#ffeceb;--mh:min(48vh,220px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","HG丸ｺﾞｼｯｸM-PRO","Yu Gothic UI",Meiryo,sans-serif;font-weight:800;background:#b9500c;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible{outline:3px solid #166ce7;outline-offset:3px}
button:disabled{cursor:default}
.hidden,[hidden]{display:none!important}

/* ステージ（しま模様のオレンジ） */
.app{position:relative;overflow:hidden;width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:10px max(14px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background-color:#ff9424;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.09) 0 56px,transparent 56px 112px),linear-gradient(180deg,#ffb043 0%,#ff8d20 55%,#ec6f0c 100%)}
@media(min-width:900px) and (min-height:520px){.app{width:min(880px,calc(100vw - 64px));height:min(460px,calc(100vh - 64px));border-radius:30px;padding:12px 22px 8px;box-shadow:0 0 0 7px var(--ink),0 24px 60px rgba(60,20,0,.45)}}

/* 枠：紺の線＋クリームの縁＋白 */
.frame{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:inset 0 0 0 5px var(--rim),0 5px 0 rgba(43,36,66,.35)}
.iconbtn{display:grid;place-items:center;width:30px;height:28px;flex-shrink:0;border:2px solid var(--ink);border-radius:9px;background:#fff}
.iconbtn svg{width:15px;height:15px}
.eyebrow{font:800 9px Arial,sans-serif;letter-spacing:2px;color:#a08a6e}

/* ステージ選択 */
.select{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,2.2vh,10px);padding-bottom:6px}
.legend{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub);white-space:nowrap}
.legend i{display:inline-block;width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;background:#cfe3ff}
/* 地図 */
.map{--node:clamp(38px,15vh,58px);position:relative;flex:1;min-height:0;overflow:hidden;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 rgba(43,36,66,.35);background-color:#8fd16a;background-image:radial-gradient(rgba(255,255,255,.22) 1.5px,transparent 1.5px),radial-gradient(circle at 20% 30%,#a6de7f 0,transparent 30%),radial-gradient(circle at 75% 70%,#a6de7f 0,transparent 32%),linear-gradient(170deg,#9edb75,#7cc55a);background-size:16px 16px,100% 100%,100% 100%,100% 100%}
.map svg.road{position:absolute;inset:0;width:100%;height:100%}
.road .edge{fill:none;stroke:#b98a4a;stroke-width:calc(var(--node) * .5);stroke-linecap:round;stroke-linejoin:round}
.road .sand{fill:none;stroke:#f6dba0;stroke-width:calc(var(--node) * .38);stroke-linecap:round;stroke-linejoin:round}
.road .dash{fill:none;stroke:#fff6dd;stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round}
.deco{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.deco.tree{width:calc(var(--node) * .7)}
.deco.pond{width:22%;height:24%;border-radius:50%;border:3px solid #3f8fbf;background:radial-gradient(circle at 35% 35%,#bfe9ff,#6cc0ec);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.deco.flower{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #ffd34d}
.node-wrap{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:2}
.node{display:grid;place-items:center;width:var(--node);height:var(--node);padding:0;border:3px solid var(--ink);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#fff3cf 45%,#ffd98a 100%);color:var(--orange-d);font:900 clamp(12px,4.6vh,17px) Arial,sans-serif;box-shadow:0 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.node:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.node:active{transform:translateY(4px);box-shadow:none}
.node.past{background:radial-gradient(circle at 35% 30%,#fff 0,#e3efff 45%,#a9cbff 100%);color:#2b5aa8}
.node.cleared{box-shadow:0 0 0 3px #ffd34d,0 4px 0 var(--ink)}
/* 星3つ（パーフェクト）のステージは金色にぬる */
.node.perfect{background:radial-gradient(circle at 35% 30%,#fffbe0 0,#ffd54a 45%,#f2a100 100%);color:#7a3d00}
.node.mix.perfect{background:linear-gradient(#fff3b0,#f5b400)}
.node.here{animation:glow 1.6s ease-in-out infinite}
.node.mix{width:calc(var(--node) * 1.5);border-radius:14px;background:linear-gradient(#fff,#ffd9a6);color:var(--ink);font-size:clamp(14px,5vh,19px);line-height:1}
.node.mix small{display:block;font-size:9px;letter-spacing:1px;color:#b0402a}
.flag{position:absolute;bottom:calc(100% - 6px);left:50%;width:calc(var(--node) * .5);transform:translateX(-10%);pointer-events:none}
.nstars{margin-top:3px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.85);font-size:clamp(9px,3.2vh,12px);letter-spacing:1px;color:#ffb300;-webkit-text-stroke:.4px #a06a00;line-height:1.35;white-space:nowrap}
.nstars.none{color:#c9c2b4;-webkit-text-stroke:0}
.mapmugi{position:absolute;z-index:3;height:calc(var(--node) * 1.35);transform:translate(0,-78%);pointer-events:none;filter:drop-shadow(0 3px 0 rgba(40,70,20,.3));transform-origin:50% 100%}
.mapmugi.walk{transition:left .9s ease-in-out,top .9s ease-in-out}
.mapmugi.hop{animation:hop .45s ease-out 2}
.app.on-select #mugi{display:none}
/* ステージの名前（W2 の「I・you」など） */
.nlabel{margin-top:2px;padding:0 6px;border-radius:6px;background:rgba(43,36,66,.75);color:#fff;font-size:clamp(9px,3vh,11px);line-height:1.5;white-space:nowrap}
/* ワールドごとの地図の地形 */
.deco.icon svg{display:block;height:100%;width:auto}
.deco.isle{width:calc(var(--node) * 2);height:calc(var(--node) * 1.45);border-radius:50%;border:3px solid #c9a35a;background:radial-gradient(circle at 45% 40%,#ffe9b5,#f0d08e);box-shadow:0 0 0 5px rgba(255,255,255,.35)}
.map.t-mount{background-color:#c9b596;background-image:radial-gradient(rgba(255,255,255,.2) 1.5px,transparent 1.5px),linear-gradient(170deg,#dccdb0,#b09a7c)}
.map.t-mount .road .edge{stroke:#8a735a}.map.t-mount .road .sand{stroke:#efe3c9}
.map.t-sea{background-color:#4cb3e4;background-image:radial-gradient(rgba(255,255,255,.25) 1.5px,transparent 1.5px),linear-gradient(160deg,#69c6ee,#3a9fd6)}
.map.t-sea .road .edge,.map.t-sea .road .sand{display:none}
.map.t-sea .road .dash{stroke:#fff;stroke-width:4;stroke-dasharray:3 9}
.map.t-desert{background-color:#f2cc78;background-image:radial-gradient(rgba(255,255,255,.25) 1.5px,transparent 1.5px),linear-gradient(170deg,#f8dd98,#e8b75a)}
.map.t-desert .road .edge{stroke:#b9853a}.map.t-desert .road .sand{stroke:#fff1cc}
.map.t-snow{background-color:#e3eef7;background-image:radial-gradient(rgba(255,255,255,.7) 1.5px,transparent 1.5px),linear-gradient(170deg,#f6fbff,#cfe2f0)}
.map.t-snow .road .edge{stroke:#93b4cc}.map.t-snow .road .sand{stroke:#fff}.map.t-snow .road .dash{stroke:#bcd3e4}
.map.t-snow .deco.icon svg path[stroke="#fff"]{stroke:#9cc3de}
/* 名詞のダンジョン（洞窟） */
.map.t-cave{--node:clamp(32px,12vh,48px);background-color:#4b4459;background-image:radial-gradient(rgba(255,255,255,.09) 2px,transparent 2px),radial-gradient(circle at 50% 50%,#655d77 0,transparent 70%),linear-gradient(170deg,#5d566c,#352f42);background-size:22px 22px,100% 100%,100% 100%}
.map.t-cave .road .edge{stroke:#251f33}.map.t-cave .road .sand{stroke:#8f88a3}.map.t-cave .road .dash{stroke:#d3cde2}
.node.area{width:calc(var(--node) * 1.3);height:calc(var(--node) * 1.3);font-size:clamp(15px,5.6vh,21px);background:radial-gradient(circle at 35% 30%,#fff 0,#e9e2ff 45%,#b9a6ef 100%);color:#4a3a8a}
.node.area.perfect{background:radial-gradient(circle at 35% 30%,#fffbe0 0,#ffd54a 45%,#f2a100 100%);color:#7a3d00}
/* 名前の長いワールドの札（前置詞・疑問詞・あいさつの雪原）は2行にする */
.wnode.two{height:auto;min-height:var(--wh);padding:3px 12px 3px 4px;border-radius:18px;line-height:1.15;text-align:left}
/* ワールドの見出しは1行に収める（長いときは「…」） */
#select .sel-head .titles{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 1段に6つ並ぶ地図（ステージが16以上） */
.map.dense{--node:clamp(30px,11vh,44px)}
.map.dense .nlabel{font-size:clamp(8px,2.6vh,10px);padding:0 4px}
.node.locked{background:#d6d1de;color:#8a8396;border-color:#6e6880;box-shadow:0 4px 0 #6e6880}
.sel-head{display:flex;align-items:center;gap:12px;padding:6px 10px 6px 18px;border-radius:16px}
.sel-head .titles{flex:1;min-width:0;line-height:1.15}
.sel-head small{display:block;font:900 10px Arial,sans-serif;letter-spacing:2px;color:var(--orange-d)}
.sel-head strong{font-size:clamp(16px,5.6vh,22px);font-weight:900}
.sel-head .sub{font-size:12px;color:var(--sub);margin-left:8px;font-weight:800}
.learned{display:inline-flex;align-items:baseline;gap:4px;margin-left:10px;padding:1px 10px;border:2px solid var(--green-d);border-radius:999px;background:var(--green-bg);color:var(--green-d);font-size:12px;font-weight:900;white-space:nowrap;vertical-align:3px}
.learned b{font:900 15px Arial,sans-serif}
.starchip{display:flex;align-items:center;gap:4px;padding:3px 12px;border:2px solid var(--ink);border-radius:999px;background:#fff8e1;font-size:14px;font-weight:900;white-space:nowrap}
.starchip b{color:#f5a400}

/* 世界地図（6つのワールドがある島） */
.worldmap{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,2.2vh,10px);padding-bottom:6px}
.wm{--wh:clamp(28px,10vh,40px);position:relative;flex:1;min-height:0;overflow:hidden;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 rgba(43,36,66,.35);background-color:#4cb3e4;background-image:radial-gradient(rgba(255,255,255,.25) 1.5px,transparent 1.5px),linear-gradient(160deg,#69c6ee,#3a9fd6);background-size:18px 18px,100% 100%}
.wm svg.wroad{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.wroad path{fill:none;stroke:#fff8e6;stroke-width:4;stroke-dasharray:3 8;stroke-linecap:round;filter:drop-shadow(0 1px 0 rgba(43,36,66,.45))}
.wland{position:absolute;inset:0;width:100%;height:100%}
.wland path{vector-effect:non-scaling-stroke;stroke-linejoin:round}
.wland .shore{fill:none;stroke:rgba(255,255,255,.4);stroke-width:12}
.wland .land{fill:#f3d89b;stroke:#c9a35a;stroke-width:3}
.wland .area{stroke:rgba(43,36,66,.25);stroke-width:2}
.wland .grass{fill:#8fd16a}.wland .mount{fill:#c4ae8f}.wland .desert{fill:#f2c86a}.wland .snow{fill:#eef6fb}.wland .dungeon{fill:#77708a}
.wdeco{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.wdeco svg{display:block;height:100%;width:auto}
.wnode-wrap{position:absolute;z-index:2;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.wnode{display:flex;align-items:center;gap:6px;height:var(--wh);padding:0 12px 0 4px;border:3px solid var(--ink);border-radius:999px;background:linear-gradient(#fff,#fff1cc);box-shadow:0 4px 0 var(--ink);font-size:clamp(11px,3.9vh,15px);font-weight:900;white-space:nowrap;transition:transform .12s,box-shadow .12s}
.wnode:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.wnode:active{transform:translateY(4px);box-shadow:none}
.wnode .wno{display:grid;place-items:center;height:calc(var(--wh) - 12px);min-width:calc(var(--wh) - 12px);padding:0 5px;border-radius:999px;background:var(--orange);color:#fff;font:900 clamp(10px,3.4vh,13px) Arial,sans-serif}
.wnode.here{animation:wglow 1.6s ease-in-out infinite}
.wnode.locked{background:linear-gradient(#f4f1ea,#dfd9cc);color:#8a8396;box-shadow:0 4px 0 #6e6880;border-color:#6e6880}
.wnode.locked .wno{background:#a59fb0}
.wnode.dungeon .wno{background:var(--ink)}
.wstars{margin-top:3px;padding:0 7px;border-radius:999px;background:rgba(255,255,255,.9);font-size:clamp(9px,3.2vh,12px);line-height:1.4;white-space:nowrap;color:var(--ink)}
.wstars b{color:#f5a400}
.wstars.soon{color:#8a8396}
.wmugi{position:absolute;z-index:3;height:calc(var(--wh) * 2);transform:translate(-100%,-88%);pointer-events:none;filter:drop-shadow(0 3px 0 rgba(20,60,90,.3))}
.toast{position:absolute;z-index:5;left:50%;bottom:12px;transform:translate(-50%,10px);padding:6px 16px;border:3px solid var(--ink);border-radius:999px;background:#fff;font-size:13px;font-weight:900;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.backbtn{width:34px;height:34px}

/* 問題カード */
.game{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,2.4vh,12px)}
.card{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;margin-top:14px;padding:clamp(14px,4.4vh,22px) 20px clamp(8px,2.4vh,12px);transition:box-shadow .25s}
.card.celebrate{box-shadow:inset 0 0 0 5px #9fe0b8,0 5px 0 rgba(43,36,66,.35)}
.qtab{position:absolute;top:-17px;left:50%;transform:translateX(-50%);padding:2px 30px 3px;border:3px solid var(--ink);border-radius:14px;background:linear-gradient(#fff9e6,var(--rim));color:var(--orange-d);font-size:19px;font-weight:900;letter-spacing:3px;white-space:nowrap;box-shadow:0 3px 0 rgba(43,36,66,.35)}
.card.celebrate .qtab{background:linear-gradient(#f2fff6,#bdebcf);color:var(--green-d)}
.world{position:absolute;top:10px;left:16px;font:800 10px Arial,sans-serif;letter-spacing:1.5px;color:#c27a35}
.pos{position:absolute;top:9px;right:16px;font-size:13px;font-weight:800}
/* 左に単語と発音ボタン、右に英文 */
.center{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);align-items:center;gap:clamp(12px,3vw,24px);padding-top:4px}
.wordside{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.sentence{min-width:0;padding-left:clamp(12px,3vw,24px);border-left:3px dashed #f1dfb8}
.word{font-size:clamp(34px,15vh,68px);font-weight:900;line-height:1.05;margin:0;letter-spacing:-.5px;outline:none;max-width:100%;overflow-wrap:anywhere}
.word.long{font-size:clamp(28px,11vh,50px)}
.english{font-family:"M PLUS Rounded 1c",Arial,sans-serif;font-weight:800;font-size:clamp(15px,5.4vh,23px);line-height:1.35;margin:4px 0 0;color:#3b3552}
.english.long{font-size:clamp(13px,4.6vh,19px)}
.translation{margin:6px 0 0;color:var(--green-d);font-weight:800;font-size:clamp(12px,4vh,16px);animation:rise .3s ease-out}
.audio-note{font-size:11px;margin:4px 0 0;color:#a34a00}
.sound{margin-top:clamp(4px,1.8vh,10px);display:inline-flex;align-items:center;gap:6px;border:2px solid #e8c98a;border-radius:999px;background:linear-gradient(#fffaf0,#ffe7b8);color:#9a5a12;padding:5px 14px 5px 10px;font-size:13px;font-weight:800;box-shadow:0 3px 0 #e2b664;transition:transform .12s,box-shadow .12s}
.sound svg{width:15px;height:15px}
.sound:active{transform:translateY(3px);box-shadow:none}
.cardfoot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;min-height:36px;margin-top:4px}
.feedback{grid-column:2;margin:0;font-size:15px;font-weight:900;color:var(--sub);white-space:nowrap}
.feedback.wrong{color:#c4373b}
.feedback.correct{color:var(--green-d)}
.footright{grid-column:3;justify-self:end;display:flex;align-items:center;gap:8px}
.next{height:36px;padding:0 18px;border:3px solid var(--ink);border-radius:12px;background:linear-gradient(#3cc276,var(--green));color:#fff;font-size:14px;font-weight:900;white-space:nowrap;box-shadow:0 4px 0 var(--ink);animation:pop .3s ease-out;transition:transform .1s,box-shadow .1s}
.next:active{transform:translateY(4px);box-shadow:none}
.next.off{display:none}
/* 要チェック（不安な単語に自分で印を付ける） */
.checkbtn{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px 0 9px;border:2px solid #d9c9ad;border-radius:999px;background:#fff;color:#8a7a62;font-size:13px;font-weight:900;white-space:nowrap;box-shadow:0 3px 0 #d9c9ad;transition:transform .1s,box-shadow .1s,background .15s}
.checkbtn svg{width:15px;height:15px}
.checkbtn:active{transform:translateY(3px);box-shadow:none}
.checkbtn.on{border-color:var(--ink);background:linear-gradient(#ffb04a,var(--orange));color:#fff;box-shadow:0 3px 0 var(--ink)}
.checkbtn.on svg path{fill:#fff}
.checkmini{float:right;height:24px;padding:0 9px;border:2px solid #d9c9ad;border-radius:999px;background:#fff;color:#8a7a62;font-size:11px;font-weight:900}
.checkmini.on{border-color:var(--orange-d);background:var(--orange);color:#fff}
.checkopen{display:inline-flex;align-items:center;gap:4px;margin-left:8px;height:26px;padding:0 10px 0 8px;border:2px solid var(--ink);border-radius:999px;background:linear-gradient(#ffb04a,var(--orange));color:#fff;font-size:12px;font-weight:900;white-space:nowrap;vertical-align:3px;box-shadow:0 2px 0 var(--ink)}
#worldmap .titles{white-space:nowrap}
@media(max-width:860px){#worldmap .sel-head .sub{display:none}}
.checkopen svg{width:14px;height:14px}
.checkopen:active{transform:translateY(3px);box-shadow:none}
.checkopen.empty{background:#fff;color:#8a7a62;border-color:#d9c9ad;box-shadow:0 3px 0 #d9c9ad}
/* 音声 ON/OFF（問題を開いたときに自動で読み上げるか） */
.speakbtn{display:inline-flex;align-items:center;gap:3px;margin-left:6px;height:26px;padding:0 9px 0 7px;border:2px solid var(--green-d);border-radius:999px;background:var(--green-bg);color:var(--green-d);font-size:12px;font-weight:900;white-space:nowrap;vertical-align:3px;box-shadow:0 2px 0 var(--green-d)}
.speakbtn svg{width:15px;height:15px}
.speakbtn:active{transform:translateY(2px);box-shadow:none}
.speakbtn .x{display:none}
.speakbtn.off{border-color:#b9b2a6;background:#f1eee8;color:#8a8396;box-shadow:0 2px 0 #b9b2a6}
.speakbtn.off .wave{display:none}.speakbtn.off .x{display:inline}

/* 下段：ムギの右側に選択肢と進み具合 */
.lower{flex-shrink:0;margin-left:calc(var(--mh) * .7)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,2.4vh,12px) 14px}
.choice{display:flex;align-items:center;gap:10px;height:clamp(40px,13vh,58px);padding:0 16px;text-align:left;font-size:clamp(14px,5vh,20px);font-weight:900;line-height:1.2;transition:transform .1s,box-shadow .1s,background .15s;border-radius:14px}
.choice.long{font-size:clamp(11px,3.8vh,15px)}
.choice.xlong{font-size:clamp(10px,3.4vh,13px);line-height:1.15}
.choice:hover:not(:disabled){background:#fffbef}
.choice:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 0 0 5px var(--rim)}
.number{flex-shrink:0;font-size:clamp(15px,5.2vh,21px);font-weight:900;color:#e0892c}
.mark{margin-left:auto;font-size:18px;font-weight:900}
.choice.correct{background:var(--green-bg);box-shadow:inset 0 0 0 5px #9fe0b8,0 5px 0 rgba(43,36,66,.35);color:var(--green-d);animation:pop .4s ease-out}
.choice.correct .number{color:var(--green)}
.choice.correct .mark:after{content:'✓'}
.choice.wrong{background:var(--red-bg);border-color:#a8656a;box-shadow:inset 0 0 0 5px #fbd0d0,0 1px 0 rgba(43,36,66,.35);color:#b4383c;transform:translateY(4px);animation:shake .35s ease-in-out}
.choice.wrong .number{color:#d97a7d}
.choice.wrong .mark:after{content:'×'}
.choice:disabled:not(.wrong):not(.correct){opacity:.6}

.bottombar{display:flex;align-items:center;gap:10px;margin-top:clamp(6px,2.2vh,10px)}
.track{display:flex;gap:3px;flex:1;padding:3px;border:2px solid var(--ink);border-radius:8px;background:#5a3a2a}
.step{flex:1;height:9px;border-radius:3px;background:rgba(255,255,255,.15);transition:background .3s}
.step.done{background:linear-gradient(#7ee39f,#2fb463)}
.step.current{background:#ffe08a;animation:pulse 1.4s ease-in-out infinite}
.progresscount{font:900 15px Arial,sans-serif;color:#fff;min-width:44px;text-align:right;text-shadow:0 2px 0 rgba(90,40,0,.5)}
.chip{display:flex;align-items:center;gap:4px;flex-shrink:0;padding:2px 10px;border:2px solid var(--ink);border-radius:999px;background:#fff;font-weight:900;font-size:13px}
.chip svg{width:14px;height:14px;color:#f5a400}

/* ムギ（左下） */
.mugi{position:absolute;z-index:3;left:max(2px,env(safe-area-inset-left));bottom:0;height:var(--mh);width:auto;pointer-events:none;filter:drop-shadow(0 4px 0 rgba(90,40,0,.25));transform-origin:50% 100%}
.mugi.happy{animation:jump .6s ease-out}
.mugi.oops{animation:droop .5s ease-in-out}
.mugi.cheer{animation:jump .7s ease-out 3}

/* 結果画面 */
.result{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;margin:4px 0 0 calc(var(--mh) * .7)}
.result-main{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
.result h2{font-size:22px;margin:2px 0;outline:none;font-weight:900}
.stars{font-size:30px;color:#ffba16;letter-spacing:5px;line-height:1.2;-webkit-text-stroke:1.5px var(--ink)}
.stat{font:900 42px/1.1 Arial,sans-serif;letter-spacing:-2px}
.stat small{font-size:17px;color:var(--sub);letter-spacing:0}
.result-main p{margin:4px 0 0;font-size:12px;line-height:1.5}
.result-side{display:flex;flex-direction:column;gap:8px;min-height:0}
.btnrow{display:flex;gap:8px;flex-shrink:0}
.bigbtn{flex:1;height:42px;padding:0 10px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-size:14px;font-weight:900;white-space:nowrap;box-shadow:0 4px 0 var(--ink)}
.bigbtn.primary{background:linear-gradient(#ffb04a,var(--orange));color:#fff;text-shadow:0 2px 0 rgba(150,60,0,.5)}
.bigbtn:active{transform:translateY(4px);box-shadow:none}
.review{flex:1;min-height:0;overflow:auto;text-align:left;padding:0 16px}
.review summary{cursor:pointer;padding:10px 0 8px;position:sticky;top:0;background:#fff}
.review-item{border-top:1px solid #f0e4d0;padding:9px 0;font-size:13px;line-height:1.55}
.review-item strong{font-size:19px;margin-right:10px}
.review-item p{margin:2px 0;font-weight:500}
.badge{display:inline-block;margin-top:3px;padding:2px 9px;border-radius:999px;font-size:11px;background:var(--green-bg);color:var(--green-d)}
.badge.retry{background:#fff1d6;color:#8a5200}

/* 正解エフェクト */
.burst{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2;border-radius:18px}
.spark{position:absolute;left:50%;top:45%;font-size:20px;color:#ffbd00;animation:spark .8s ease-out both}

/* スマホを縦にしているときは「横にしてね」を全面に出す */
.rotate{display:none;position:fixed;inset:0;z-index:50;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:#fff;background:linear-gradient(160deg,#ffb23f,#ff7a1f)}
.rotate img{height:34vh;filter:drop-shadow(0 4px 0 rgba(90,40,0,.25))}
.rotate svg{width:56px;height:56px;animation:turn 2.2s ease-in-out infinite}
.rotate h2{margin:0;font-size:22px;font-weight:900;text-shadow:0 2px 0 rgba(160,70,0,.4)}
.rotate p{margin:0;font-size:14px;line-height:1.7}
.rotate button{height:46px;padding:0 22px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--orange-d);font-size:15px;font-weight:900;box-shadow:0 4px 0 var(--ink)}
@media(orientation:portrait) and (pointer:coarse){.rotate{display:flex}}

.loaderror{margin:auto;max-width:520px;padding:18px 22px;line-height:1.7}

@media(max-width:700px){.choice{padding:0 10px;gap:6px}.world{display:none}.next{padding:0 12px}.sel-head .sub{display:none}}

@keyframes pulse{50%{opacity:.55}}
@keyframes hop{0%,100%{transform:translate(0,-78%)}40%{transform:translate(0,-98%)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px #ffd34d,0 4px 0 var(--ink)}50%{box-shadow:0 0 0 7px rgba(255,211,77,.55),0 4px 0 var(--ink)}}
@keyframes pop{0%{transform:scale(.95)}55%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translate(0,4px)}25%{transform:translate(-6px,4px)}75%{transform:translate(6px,4px)}}
@keyframes rise{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@keyframes jump{0%{transform:none}25%{transform:translateY(4px) scale(1.04,.94)}50%{transform:translateY(-18%) scale(.97,1.04)}80%{transform:translateY(0) scale(1.02,.97)}100%{transform:none}}
@keyframes droop{0%,100%{transform:none}30%{transform:rotate(-5deg) translateY(3px)}60%{transform:rotate(4deg) translateY(3px)}}
@keyframes spark{0%{transform:translate(0,0) scale(.2);opacity:0}20%{opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.burst{display:none}}
</style>
</head>

function snakeLayout(n){
  const rows=n<=5?1:n<=10?2:3,ys={1:[50],2:[30,72],3:[17,49,80]}[rows],per=Math.ceil(n/rows),pos=[];
  for(let r=0;r<rows;r++){const c=Math.min(per,n-r*per),xs=[];for(let i=0;i<c;i++)xs.push(c===1?50:9+i*82/(c-1));if(r%2)xs.reverse();xs.forEach(x=>pos.push([+x.toFixed(1),ys[r]]));}
  return pos;
}

}

[[window.MUGI_ELEM,'小学校'],[window.MUGI_EXTRA,'']].forEach(([E,defaultSrc])=>{
  if(!E||!Array.isArray(E.words))return;
  const src=E.src===undefined?defaultSrc:E.src;
  const by=to=>E.words.filter(w=>w.to===to);
  [1,2,3,4,5].forEach(n=>{
    const d=window['MUGI_W'+n];if(!d)return;
    if(n===5&&E.title5){d.title=E.title5;d.sub=E.sub5||d.sub;}
    const add=by('W'+n);if(!add.length)return;
    d.stageNames=d.stageNames||{};
    let next=Math.max(...d.words.map(w=>w.stage))+1;const made={};
    add.forEach(w=>{let st;if(/^\d+$/.test(w.group))st=Number(w.group);else{if(!made[w.group]){made[w.group]=next++;d.stageNames[made[w.group]]=w.group;}st=made[w.group];}d.words.push({...w,stage:st,src});});
    d.similar=[...(d.similar||[]),...((E.similar||{})['W'+n]||[])];
  });
  // ダンジョンはテーマの最後に足してから、ステージを分け直す（17語まで1つ、28語まで2つ、それより多いと3つ）
  ['B1','B2','B3','B4'].forEach(code=>{
    const d=window['MUGI_'+code];if(!d)return;
    const add=by(code);if(!add.length)return;
    const theme=w=>(d.stageNames[w.stage]||'').replace(/[①②③④]$/,'');
    const order=[],groups={};const put=(t,w)=>{if(!groups[t]){groups[t]=[];order.push(t);}groups[t].push(w);};
    d.words.forEach(w=>put(theme(w),w));
    add.forEach(w=>put(w.group,{...w,src}));
    const words=[],names={};let st=0;
    order.forEach(t=>{const list=groups[t],n=list.length,k=n<=17?1:n<=28?2:3,base=Math.floor(n/k),extra=n%k;let i=0;
      for(let s=0;s<k;s++){st++;names[st]=t+(k>1?'①②③'[s]:'');const size=base+(s<extra?1:0);for(let j=0;j<size;j++){const w=list[i++];w.stage=st;words.push(w);}}});
    d.words=words;d.stageNames=names;
    d.similar=[...(d.similar||[]),...((E.similar||{})[code]||[])];
  });
});

function mugiAt([x,y],off,walk){
  const m=$('mapMugi');
  m.classList.toggle('walk',walk);m.classList.remove('hop');
  m.style.left=`calc(${x}% + var(--node) * ${off} - 4px)`;m.style.top=`${y}%`;
  if(walk){m.addEventListener('transitionend',function done(e){if(e.propertyName!=='left')return;m.removeEventListener('transitionend',done);m.classList.remove('walk');void m.offsetWidth;m.classList.add('hop');},{once:false});}
}

// 過去形の問題：「〇〇の過去形」の〇〇を、正解の動詞と同じ頭文字の動詞でそろえる（saw なら see・say・sit…）
// 同じ頭文字が World 1 の動詞で足りないときは PAST_DECOYS（選択肢の補充用だけに使う動詞）で補い、
// それでも足りなければ問題の単語と同じ頭文字（went なら walk・wash…）、最後にほかの動詞から選ぶ
const PAST_DECOYS=['enter','end','hope','hold','move','mean','grow','guess','keep','kick','knock'];
function makePastChoices(w){
  const base=w.ja.replace('の過去形','');
  const bases=[...new Set(worldOf(w).words.filter(o=>!o.past&&!o.pos&&!o.en.includes(' ')).map(o=>o.en))].filter(b=>b!==base);
  const picks=[];
  const take=list=>{for(const b of shuffle(list)){if(picks.length===3)break;if(b!==base&&!picks.includes(b))picks.push(b);}};
  take(bases.filter(b=>b[0]===base[0]));
  take(PAST_DECOYS.filter(b=>b[0]===base[0]));
  take(bases.filter(b=>b[0]===w.en[0]));
  take(bases);
  return shuffle([base,...picks]).map(b=>({text:`${b}の過去形`,correct:b===base}));
}

// 不正解の選択肢：同じワールドの単語から選ぶ。つづりが同じ単語（you＝あなたは／あなたを など）と、似た意味の組は出さない。
// データに scope:"stage" があるワールドは、まず同じステージから選ぶ
// 単語のデータに wrong（不正解の選択肢3つ）が書いてあるときは、それを使う（天気・時刻の it →「それは・それを・あれは」など）
function makeChoices(w){
  if(Array.isArray(w.wrong)&&w.wrong.length>=3)return shuffle([{text:textOf(w),correct:true},...w.wrong.slice(0,3).map(t=>({text:t,correct:false}))]);
  if(w.past)return makePastChoices(w);
  const W=worldOf(w),g=groupKey(w);
  const cands=W.words.filter(o=>o!==w&&!o.past&&o.en!==w.en&&textOf(o)!==textOf(w)&&(g===undefined||groupKey(o)!==g));
  const first=W.data.scope==='stage'?shuffle(cands.filter(o=>o.stage===w.stage)):[];
  const pool=[...first,...shuffle(cands.filter(o=>!first.includes(o)))];
  const picks=[];
  for(const o of pool){if(picks.some(p=>textOf(p)===textOf(o)))continue;picks.push(o);if(picks.length===3)break;}
  return shuffle([w,...picks]).map(o=>({text:textOf(o),correct:o===w}));
}

function startStage(i){
  stopAudio();
  stage=cur.stages[i];pendingWalk=null;cur.saved.here=i;persist();
  const list=stage.mix?shuffle([...stage.words]).slice(0,MIX_SIZE):shuffle([...stage.words]);
  qs=list.map(w=>({w,choices:makeChoices(w)}));
  index=0;firstTry=0;records=[];setScore();
  $('track').setAttribute('aria-valuemax',qs.length);
  show('game');render(true);
}

function setFeedback(state,text){$('feedback').className='feedback'+(state?' '+state:'');$('feedback').textContent=text;}
function setScore(){$('score').textContent=firstTry;$('scoreChip').setAttribute('aria-label',`一発正解 ${firstTry}問`);}
function progress(count){$('track').replaceChildren(...qs.map((q,i)=>{const el=document.createElement('span');el.className='step'+(i<count?' done':i===count?' current':'');el.setAttribute('aria-hidden','true');return el}));$('track').setAttribute('aria-valuenow',count);$('progressCount').textContent=`${count}/${qs.length}`;}

function render(focus=false){
  card.classList.remove('celebrate');document.querySelectorAll('.burst').forEach(el=>el.remove());mugi();
  const {w,choices}=qs[index];solved=false;mistakes=0;
  $('questionNo').textContent=`第${index+1}問`;
  $('stageLabel').textContent=stage.check?'要チェックの単語':cur.info.code?`${stage.name} ${stage.label||cur.data.title}`:`WORLD ${stage.name} ${stage.label||cur.data.title}`;
  paintCheckBtn($('checkBtn'),isChecked(w));
  $('pos').textContent=`<${posLabel(w)}>`;
  $('word').textContent=w.en;$('word').classList.toggle('long',w.en.length>7);
  $('example').textContent=w.ex||'';$('example').classList.toggle('long',(w.ex||'').length>34);
  $('translation').hidden=true;$('translation').textContent='';$('audioNote').hidden=true;
  $('next').disabled=true;$('next').classList.add('off');
  setFeedback('','意味を選んでね');
  $('choices').replaceChildren(...choices.map((c,i)=>{const button=document.createElement('button');button.type='button';button.className='choice frame'+(c.text.length>13?' xlong':c.text.length>9?' long':'');const n=document.createElement('span');n.className='number';n.textContent=(i+1)+'.';const lb=document.createElement('span');lb.textContent=c.text;const mark=document.createElement('span');mark.className='mark';mark.setAttribute('aria-hidden','true');button.append(n,lb,mark);button.addEventListener('click',()=>answer(i));return button}));
  progress(index);if(focus)$('word').focus();
  if(autoSpeak)speakWord(w);
}

function answer(choice){
  if(solved||$('game').hidden)return;const button=$('choices').children[choice];if(!button||button.disabled)return;
  const q=qs[index];
  if(!q.choices[choice].correct){mistakes++;button.classList.add('wrong');button.disabled=true;setFeedback('wrong','おしい！ もう一度');mugi('oops');sfx('ng');const available=[...$('choices').children].find(b=>!b.disabled);if(available)available.focus();return;}
  solved=true;celebrate();mugi('happy');sfx('ok');if(mistakes===0){firstTry++;addLearned(q.w);}records.push({first:mistakes===0});
  button.classList.add('correct');[...$('choices').children].forEach(b=>b.disabled=true);
  $('translation').textContent=q.w.exJa||'';$('translation').hidden=!q.w.exJa;
  setFeedback('correct',mistakes===0?'正解！ 一発クリア！':'正解！');setScore();
  const last=index===qs.length-1;
  $('next').textContent=last?'結果へ ▶':'次の問題へ ▶';$('next').disabled=false;$('next').classList.remove('off');
  progress(index+1);$('next').focus();
}

function celebrate(){card.classList.add('celebrate');const burst=document.createElement('div');burst.className='burst';burst.setAttribute('aria-hidden','true');for(let i=0;i<12;i++){const star=document.createElement('span');star.className='spark';star.textContent='✦';const angle=i*Math.PI/6;star.style.setProperty('--x',Math.cos(angle)*170+'px');star.style.setProperty('--y',Math.sin(angle)*70+'px');star.style.setProperty('--r',i*40+'deg');burst.append(star);}card.append(burst);setTimeout(()=>burst.remove(),900);}

function finish(){
  stopAudio();show('result');mugi('cheer');
  const n=qs.length;const stars=firstTry===n?3:firstTry>=Math.ceil(n*.7)?2:1;
  if(!stage.check){
    saveBest(stage.id,stars);
    // ステージ選択にもどったとき、ムギが次のステージへ歩いていく
    const to=Math.min(stage.index+1,cur.stages.length-1);
    if(to!==stage.index){pendingWalk={from:stage.index,to};cur.saved.here=to;persist();}
  }
  $('resultEyebrow').textContent=stage.check?'要チェック COMPLETE':cur.info.code?`${stage.name} COMPLETE`:`WORLD ${stage.name} COMPLETE`;
  $('toSelect').textContent=stage.check?'世界地図':'ステージ選択';
  $('stars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);$('stars').setAttribute('aria-label',`星3つ中${stars}つ`);
  $('resultScore').replaceChildren(String(firstTry),Object.assign(document.createElement('small'),{textContent:` / ${n}`}));
  $('resultMessage').textContent=`一発正解 ${firstTry}問。`+(firstTry===n?'全問パーフェクト！':'もう一度遊んで、満点を目指そう。');
  const hasNext=!stage.check&&stage.index<cur.stages.length-1;$('nextStage').hidden=!hasNext;
  if(hasNext)$('nextStage').textContent=`${cur.stages[stage.index+1].name} へ ▶`;
  $('reviewList').replaceChildren(...qs.map((q,i)=>{const w=q.w;const row=document.createElement('div');row.className='review-item';const word=document.createElement('strong');word.textContent=w.en;word.lang='en';const meaning=document.createElement('span');meaning.textContent=label(w.ja)+`〈${posLabel(w)}〉`;const en=document.createElement('p');en.textContent=w.ex||'';en.lang='en';const ja=document.createElement('p');ja.textContent=w.exJa||'';const badge=document.createElement('span');badge.className='badge'+(records[i].first?'':' retry');badge.textContent=records[i].first?'○ 一発正解':'↻ 選び直して正解';const cm=document.createElement('button');cm.type='button';cm.className='checkmini';paintCheckBtn(cm,isChecked(w));cm.setAttribute('aria-label',`${w.en}を要チェックにする`);cm.addEventListener('click',()=>paintCheckBtn(cm,toggleCheck(w)));row.append(cm,word,meaning,en,ja,badge);return row}));
  document.querySelector('.review').open=true;$('resultHeading').focus();
}

function stopAudio(){if('speechSynthesis' in window)window.speechSynthesis.cancel();}
// 読み上げがおかしくなる単語の読ませ方。例文での使われ方に合わせて、同じ音になるつづりで読ませる
//  I：ローマ数字の「1」や文字の名前と読まれることがある → eye（アイ）
//  live・close・use：例文ではどれも動詞なので、動詞の読み方（リブ・クローズ・ユーズ）にする
//  read の現在形・過去形は、データの say 欄で読み分けている（Read.／red）
//  present・wind・minute・subject・contest・entrance は例文で名詞なので、そのまま（1語だけなら名詞の読み方になる）
const SAY_FIX={'I':'eye','live':'liv','close':'cloze','use':'yooz'};
function speakWord(w){if(!('speechSynthesis' in window)){audioError();return;}stopAudio();const u=new SpeechSynthesisUtterance(w.say||SAY_FIX[w.en]||w.en);u.lang='en-US';u.rate=.8;const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(voice)u.voice=voice;u.onerror=e=>{if(e.error!=='canceled'&&e.error!=='interrupted')audioError();};$('audioNote').hidden=true;window.speechSynthesis.speak(u);}
$('sound').addEventListener('click',()=>speakWord(qs[index].w));
// 音声 ON/OFF：ON のときは問題を開くたびに発音を自動で流す（はじめは ON。設定は端末に残す）
const SPEAK_KEY='mugiQuest4taku.autoSpeak';
// 正解の「ピンポン」と、まちがいの「ブッ」。音のファイルは使わず、その場で音を作って鳴らす（音声OFFのときは鳴らさない）
let actx=null;
function sfx(kind){
  if(!autoSpeak)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t=actx.currentTime;
    const tone=(freq,start,dur,type,vol)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t+start);g.gain.setValueAtTime(0.0001,t+start);g.gain.exponentialRampToValueAtTime(vol,t+start+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+start+dur);o.connect(g);g.connect(actx.destination);o.start(t+start);o.stop(t+start+dur+0.05);};
    if(kind==='ok'){tone(1318.5,0,0.3,'sine',0.35);tone(1046.5,0.16,0.6,'sine',0.35);}
    else{tone(150,0,0.28,'square',0.16);tone(105,0,0.28,'sawtooth',0.12);}
  }catch(e){}
}
let autoSpeak=store.get(SPEAK_KEY,true)!==false;
function paintSpeak(){$('speakToggle').classList.toggle('off',!autoSpeak);$('speakToggle').setAttribute('aria-pressed',String(autoSpeak));$('speakLabel').textContent=autoSpeak?'音声ON':'音声OFF';$('speakToggle').setAttribute('aria-label',autoSpeak?'音声（発音と正解・まちがいの音）：ON':'音声（発音と正解・まちがいの音）：OFF');}
$('speakToggle').addEventListener('click',()=>{autoSpeak=!autoSpeak;store.set(SPEAK_KEY,autoSpeak);paintSpeak();});
paintSpeak();
function audioError(){$('audioNote').textContent='音声を再生できませんでした。端末の英語音声設定を確認してください。';$('audioNote').hidden=false;}
$('next').addEventListener('click',()=>{if(!solved)return;stopAudio();if(index===qs.length-1)finish();else{index++;render(true);}});
// 要チェックの単語だけで出題する（全ワールドから。多いときは毎回ランダムに CHECK_SIZE 問）
function startCheck(){
  const list=ALL_WORDS.filter(isChecked);
  if(!list.length){renderWorld();toast('出題画面の「要チェック」ボタンで単語を集めよう');return;}
  stopAudio();
  stage={id:'check',name:'要チェック',check:true,words:list,index:-1};pendingWalk=null;
  qs=shuffle([...list]).slice(0,CHECK_SIZE).map(w=>({w,choices:makeChoices(w)}));
  index=0;firstTry=0;records=[];setScore();
  $('track').setAttribute('aria-valuemax',qs.length);
  show('game');render(true);
}
const leaveStage=()=>{stopAudio();if(stage&&stage.check)renderWorld();else renderSelect();};
$('checkBtn').addEventListener('click',()=>paintCheckBtn($('checkBtn'),toggleCheck(qs[index].w)));
$('checkOpen').addEventListener('click',startCheck);
$('restart').addEventListener('click',()=>stage.check?startCheck():startStage(stage.index));
$('nextStage').addEventListener('click',()=>startStage(stage.index+1));
$('toSelect').addEventListener('click',leaveStage);
$('back').addEventListener('click',()=>{if(!$('game').hidden&&(index>0||solved)&&!confirm('もどりますか？\n（このステージの途中の記録は残りません）'))return;leaveStage();});
document.addEventListener('keydown',e=>{if(!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('game').hidden&&/^[1-4]$/.test(e.key)){e.preventDefault();answer(Number(e.key)-1);}});
// 全画面＋横向き固定（Android の Chrome など対応ブラウザのみ。iPhone ではボタン自体を出さない）
const canFullscreen=document.fullscreenEnabled&&typeof document.documentElement.requestFullscreen==='function';
async function goLandscape(){try{await document.documentElement.requestFullscreen({navigationUI:'hide'});if(screen.orientation&&typeof screen.orientation.lock==='function')await screen.orientation.lock('landscape');}catch(e){}}
const fsButtons=[...document.querySelectorAll('.fsbtn')];
if(canFullscreen){fsButtons.forEach(b=>b.hidden=false);$('rotateGo').hidden=false;}
fsButtons.forEach(b=>b.addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else goLandscape();}));
$('rotateGo').addEventListener('click',goLandscape);
document.addEventListener('fullscreenchange',()=>{const on=!!document.fullscreenElement;fsButtons.forEach(b=>{b.setAttribute('aria-label',on?'全画面をやめる':'全画面にする');b.title=on?'全画面をやめる':'全画面にする';});});
// 「＜」：エリアの地図からはダンジョンの入口へ、それ以外は世界地図へもどる
$('toWorld').addEventListener('click',()=>{if(view==='area'&&cur.info.code)renderDungeon();else renderWorld();});
window.addEventListener('pagehide',stopAudio);
renderWorld();
</script>
